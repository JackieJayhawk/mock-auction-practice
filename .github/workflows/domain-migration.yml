name: One-time auction domain migration

on:
  push:
    paths:
      - '.github/workflows/domain-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update canonical domain in site metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'https://jackiejayhawk.github.io/mock-auction-practice/'
          new = 'https://auction.panjackieliu.com/'
          if old not in text:
              raise SystemExit('Old canonical URL not found; refusing to make an unexpected edit.')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit migrated metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Use auction.panjackieliu.com as canonical domain [skip ci]'
            git push
          fi
