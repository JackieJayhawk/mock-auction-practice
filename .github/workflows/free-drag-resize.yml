name: One-time free drag and resize patch

on:
  push:
    paths:
      - '.github/workflows/free-drag-resize.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make movement truly free and resize grip easy to hit
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          pattern = r'^function safePos\(id,left,top,width,height\)\{.*?^\}\nfunction makeDraggable'
          replacement = 'function safePos(id,left,top,width,height){\n  return keepInBounds(left,top,width,height);\n}\nfunction makeDraggable'
          text, n = re.subn(pattern, replacement, text, count=1, flags=re.M|re.S)
          if n != 1:
              raise SystemExit(f'safePos patch count was {n}, expected 1')

          for module_id in ('imageModule','descModule','gavelModule'):
              old = f'<div class="module" id="{module_id}">'
              new = old + '\n            <div class="resize-handle se" data-corner="se" aria-label="Resize"></div>'
              if new not in text:
                  if old not in text:
                      raise SystemExit(f'{module_id} opening tag not found')
                  text = text.replace(old, new, 1)

          marker = 'makeDraggable("priceModule","priceModuleHeader");\nmakeCornerResizable("priceModule");'
          expanded = 'makeDraggable("priceModule","priceModuleHeader");\nmakeCornerResizable("imageModule");\nmakeCornerResizable("descModule");\nmakeCornerResizable("gavelModule");\nmakeCornerResizable("priceModule");'
          if expanded not in text:
              if marker not in text:
                  raise SystemExit('resize initialization marker not found')
              text = text.replace(marker, expanded, 1)

          text = text.replace('drag + resize', 'drag')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Make auction modules freely draggable and easy to resize [skip ci]'
            git push
          fi
