name: One-time explicit favicon patch

on:
  push:
    paths:
      - '.github/workflows/add-explicit-favicon.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add explicit favicon links
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '  <link rel="canonical" href="https://auction.panjackieliu.com/" />'
          favicon = '''  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20260923" />
  <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=20260923" />'''

          if favicon not in text:
              if marker not in text:
                  raise SystemExit('canonical marker not found')
              text = text.replace(marker, marker + '\n' + favicon, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit favicon link
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Explicitly link auction favicon [skip ci]'
            git push
          fi
